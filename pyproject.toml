[project]
name = "bettbox-mcp"
version = "0.1.0"
description = "MCP server for controlling a running Bettbox (mihomo) client on Windows / macOS / Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
bettbox-mcp = "bettbox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bettbox_mcp"]
